<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro">☀ Modo claro</button>

  <div class="wrapper">
    <h1 class="title">TETRIS</h1>

    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay pause-menu hidden" role="dialog" aria-modal="true" aria-labelledby="pause-menu-title">
      <div class="pause-box">
        <p id="pause-menu-title" class="pause-title">PAUSA</p>
        <button id="pause-resume" class="pause-btn" type="button">Reanudar</button>
        <button id="pause-restart" class="pause-btn" type="button">Reiniciar</button>
        <button id="pause-controls-toggle" class="pause-btn pause-btn-secondary" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar (soft drop)</li>
          <li><kbd>Space</kbd> caída instantánea</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa / reanudar</li>
        </ul>
        <label class="pause-level" for="start-level">
          <span>Nivel inicial</span>
          <select id="start-level"></select>
        </label>
        <p class="pause-hint">Se aplica en la próxima partida</p>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
